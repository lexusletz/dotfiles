[env]
TERM = "xterm-256color"

# [general]
# import = [
#   "~/.config/alacritty/themes/themes/tokyo_night.toml",
# ]

[window]
padding.x = 10
padding.y = 10

startup_mode = "Maximized"

# Only uncomment on MacOS when trying to use Emacs
# option_as_alt = "Both"

opacity = 0.80
blur = true

[colors.primary]
background = "#000000"

[font]
normal.family = "Maple Mono NF"
normal.style = "Medium"

# Only uncomment when need to disable italics
# italic.family = "Maple Mono"
# italic.style = "SemiBold"

size = 18

[keyboard]
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r"}]
