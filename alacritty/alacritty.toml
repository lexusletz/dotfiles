[env]
TERM = "xterm-256color"

# [general]
# import = [
#   "~/.config/alacritty/themes/themes/tokyo_night.toml",
# ]

[window]
padding.x = 10
padding.y = 10

startup_mode = "Maximized"

# Only uncomment on MacOS when trying to use Emacs
# option_as_alt = "Both"

# opacity = 0.85
# blur = true

[font]
normal.family = "BlexMono Nerd Font"
normal.style = "Medium"

# Only uncomment when need to disable italics
italic.family = "BlexMono Nerd Font"
italic.style = "Medium"

size = 20

[keyboard]
bindings = [{ key = "Return", mods = "Shift", chars = "\u001b\r"}]

[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#949494"
blue = "#74b2ff"
cyan = "#85dc85"
green = "#36c692"
magenta = "#ae81ff"
red = "#ff5189"
white = "#e4e4e4"
yellow = "#c6c684"

[colors.cursor]
cursor = "#8e8e8e"
text = "#080808"

[colors.normal]
black = "#323437"
blue = "#80a0ff"
cyan = "#79dac8"
green = "#8cc85f"
magenta = "#cf87e8"
red = "#ff5d5d"
white = "#c6c6c6"
yellow = "#e3c78a"

[colors.primary]
background = "#080808"
bright_foreground = "#eeeeee"
foreground = "#bdbdbd"

[colors.selection]
background = "#b2ceee"
text = "#080808"
